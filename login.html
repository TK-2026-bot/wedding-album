<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome — Mallorca Wedding</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  /* Full-bleed photo: its aspect ratio (0.462) already matches the phone
     canvas (390:844), so it covers the whole screen with no crop/stretch. */
  .login-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* One opaque, unbroken card covering the whole area where the original
     mockup had baked-in fake UI (a single field + button + install hint).
     No gaps between the rows inside it — any gap would let those baked
     pixels show through underneath. */
  .login-form {
    position: absolute;
    left: 8.15%; width: 83.7%;
    top: 44.7%; height: 34.5%;
    z-index: 2;
    background: #ffffff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
  }
  .login-row { flex: 1; position: relative; }
  .login-row input {
    width: 100%; height: 100%;
    border: none;
    padding: 0 18px;
    font-size: 16px;
    font-family: var(--font-ui);
    color: var(--ink);
    background: #ffffff;
  }
  .login-row input:focus { outline: 2px solid var(--gold-text); outline-offset: -2px; }
  .login-row + .login-row { border-top: 1px solid var(--divider-2); }

  .login-submit {
    flex: 1;
    border: none;
    background: var(--gold);
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-ui);
    cursor: pointer;
  }
  .login-submit:disabled { opacity: .6; cursor: default; }

  .login-error {
    position: absolute;
    left: 8.15%; width: 83.7%;
    top: calc(44.7% + 34.5% + 12px);
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    font-size: 14px;
    text-align: center;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <img class="login-bg" src="assets/img/login-full.jpg" alt="Mallorca Wedding — Pau &amp; Sofia, 10.07.2026, Mallorca, Spain">
    <div class="notch"></div>

    <form class="login-form" id="login-form">
      <div class="login-row">
        <label class="sr-only" for="name" data-i18n="login.nameLabel">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
      </div>
      <div class="login-row">
        <label class="sr-only" for="code" data-i18n="login.codeLabel">Access code</label>
        <input id="code" name="code" type="text" autocomplete="off" placeholder="Access code" required>
      </div>
      <button class="login-submit" type="submit" id="login-submit" data-i18n="login.continue">Continue</button>
    </form>
    <p class="login-error" id="login-error"></p>
  </main>
  </div>
  </div>

  <script type="module">
    import { signInGuest } from "./js/auth.js";
    import { applyTranslations, t } from "./js/i18n.js";

    applyTranslations();

    document.getElementById("name").placeholder = t("login.nameLabel");
    document.getElementById("code").placeholder = t("login.codeLabel");

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("login-submit");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = t("login.signingIn");
      try {
        const name = form.name.value;
        const code = form.code.value;
        await signInGuest(name, code);
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = t(err.message) || t("login.errGeneric");
        submitBtn.disabled = false;
        submitBtn.textContent = t("login.continue");
      }
    });
  </script>
</body>
</html>
