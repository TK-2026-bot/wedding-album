<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome — Mallorca Wedding</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:#0d1f29;
    display:flex; justify-content:center; align-items:center;
  }

  .app {
    position:relative;
    height:100dvh; max-height:100dvh;
    width:auto; max-width:430px;
    aspect-ratio: 390 / 844;
    margin:auto;
    background:#0d1f29;
    overflow:hidden;
  }

  .app__bg {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  /* Живые интерактивные элементы поверх картинки — прозрачные,
     позиции откалиброваны по пикселям эталона (см. измерения). */
  .field-hit {
    position:absolute;
    top:399.7px; left:31.9px; width:326.8px; height:61.5px;
    background:transparent;
    border:none;
    border-radius:14px;
    padding:0 18px;
    font-size:16px;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:#1C1C1A;
    caret-color:#1C1C1A;
  }
  .field-hit::placeholder { color:transparent; }

  .btn-hit {
    position:absolute;
    top:483.4px; left:31.9px; width:326.8px; height:63.7px;
    background:transparent;
    border:none;
    cursor:pointer;
  }
</style>
</head>
<body>
  <main class="app">
    <img class="app__bg" src="assets/img/login.png" alt="Mallorca Wedding — Welcome">

    <input class="field-hit" type="text" placeholder="Your name" aria-label="Your name">
    <a class="btn-hit" href="index.html" aria-label="Continue" style="text-decoration:none;display:block;"></a>
  </main>
  <script>
    (function () {
      var RATIO = 390 / 844;
      var app = document.querySelector('.app');
      function resize() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var maxW = Math.min(vw, 430);
        var h = Math.min(vh, maxW / RATIO);
        var w = h * RATIO;
        app.style.width = w + 'px';
        app.style.height = h + 'px';
      }
      resize();
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>
