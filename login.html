<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome — Mallorca Wedding</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  /* Full-bleed photo: its aspect ratio (0.462) already matches the phone
     canvas (390:844), so it covers the whole screen with no crop/stretch.
     The image itself already contains the title, subtitle, name field and
     Continue button as designed in the original mockup — the elements
     below are transparent/opaque overlays positioned pixel-for-pixel on
     top of those baked shapes so the page is interactive while looking
     identical to the approved design. */
  .login-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* Bounds measured directly from the source image (686×1485):
     pill/button span x:56–630, name field y:701–811, button y:848–962. */
  .login-name {
    position: absolute;
    left: 8.163%; width: 83.673%;
    top: 47.205%; height: 7.407%;
    z-index: 1;
    border: none;
    border-radius: 999px;
    background: #FFFFFF;
    padding: 0 20px;
    font-size: 16px;
    font-family: var(--font-ui);
    color: var(--ink);
  }
  .login-name::placeholder { color: var(--muted); }
  .login-name:focus { outline: 2px solid var(--gold-text); }

  .login-submit {
    position: absolute;
    left: 8.163%; width: 83.673%;
    top: 57.098%; height: 7.677%;
    z-index: 1;
    border: none;
    border-radius: 999px;
    background: var(--gold);
    color: var(--ink);
    font-size: 17px;
    font-weight: 700;
    font-family: var(--font-ui);
    cursor: pointer;
  }
  .login-submit:disabled { opacity: .6; cursor: default; }

  .login-error {
    position: absolute;
    left: 8.163%; width: 83.673%;
    top: calc(57.098% + 7.677% + 14px);
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    font-size: 14px;
    text-align: center;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <img class="login-bg" src="assets/img/login-full.jpg" alt="Mallorca Wedding — Pau &amp; Sofia, 10.07.2026, Mallorca, Spain">
    <div class="notch"></div>

    <form id="login-form">
      <label class="sr-only" for="name" data-i18n="login.nameLabel">Your name</label>
      <input class="login-name" id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
      <button class="login-submit" type="submit" id="login-submit" data-i18n="login.continue">Continue</button>
    </form>
    <p class="login-error" id="login-error"></p>
  </main>
  </div>
  </div>

  <script type="module">
    import { signInGuest } from "./js/auth.js";
    import { applyTranslations, t } from "./js/i18n.js";

    applyTranslations();

    document.getElementById("name").placeholder = t("login.nameLabel");

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("login-submit");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = t("login.signingIn");
      try {
        const name = form.name.value;
        await signInGuest(name);
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = t(err.message) || t("login.errGeneric");
        submitBtn.disabled = false;
        submitBtn.textContent = t("login.continue");
      }
    });
  </script>
</body>
</html>
