<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome — Mallorca Wedding</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  .login-hero {
    position: relative;
    flex: 0 0 auto;
    height: 46%;
    overflow: hidden;
  }
  .login-hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .login-hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 55%, var(--bg) 100%);
  }
  .login-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px 28px 28px;
  }
  .login-title {
    font-family: var(--font-title);
    font-size: 30px;
    text-align: center;
    margin-bottom: 6px;
  }
  .login-sub {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 26px;
  }
  .login-field {
    margin-bottom: 14px;
  }
  .login-field label {
    display: block;
    font-size: 13px;
    color: var(--muted-2);
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    border: 1px solid var(--divider-2);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 16px;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--bg-alt);
  }
  .login-field input:focus { outline: 2px solid var(--gold-text); }
  .login-submit {
    margin-top: 8px;
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    background: var(--gold);
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-ui);
    cursor: pointer;
  }
  .login-submit:disabled { opacity: .6; cursor: default; }
  .login-error {
    color: var(--danger);
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
  }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <div class="notch"></div>
    <div class="screen">
      <div class="login-hero">
        <img src="assets/img/login-hero.png" alt="Mallorca Wedding — Pau &amp; Sofia, 10.07.2026, Mallorca, Spain">
      </div>
      <form class="login-body" id="login-form">
        <h1 class="login-title">Mallorca Wedding</h1>
        <p class="login-sub">Enter your name and the access code from your invitation</p>

        <div class="login-field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Sofia" required>
        </div>
        <div class="login-field">
          <label for="code">Access code</label>
          <input id="code" name="code" type="text" autocomplete="off" placeholder="e.g. PAUSOFIA26" required>
        </div>

        <button class="login-submit" type="submit" id="login-submit">Continue</button>
        <p class="login-error" id="login-error"></p>
      </form>
    </div>
  </main>
  </div>
  </div>

  <script type="module">
    import { signInGuest } from "./js/auth.js";

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("login-submit");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";
      try {
        const name = form.name.value;
        const code = form.code.value;
        await signInGuest(name, code);
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong. Try again.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue";
      }
    });
  </script>
</body>
</html>
