<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uploading — Mallorca Wedding</title>
<style>
/* ============================================================
   Mallorca Wedding App — Design system (styles.css)
   Значения строго по DESIGN_SPEC_reference.md
   ============================================================ */

@font-face {
    font-family: 'Marcellus';
    src: url(assets/fonts/marcellus.ttf) format('truetype');
    font-display: swap;
  }

:root {
  /* Палитра (spec §4) */
  --bg:            #FEFEFD;
  --bg-alt:        #FCFBF9;
  --gold:          #E0BD6E;   /* акцент: кнопки, индикаторы, активный таб */
  --gold-text:     #A88028;   /* золотой текст на светлом фоне */
  --ink:           #1C1C1A;   /* основной текст */
  --muted:         #8C8880;   /* приглушённый */
  --muted-2:       #6E6E69;
  --muted-3:       #A6A29A;   /* неактивные иконки */
  --divider:       #E5E1D8;
  --divider-2:     #ECE8E0;
  --danger:        #C24B3F;   /* Delete */

  /* Типографика */
  --font-title: 'Marcellus', Georgia, serif;              /* заголовки экранов */
  --font-ui: -apple-system, "Helvetica Neue", Arial, sans-serif;

  /* Метрики (spec §2, §5) */
  --topbar-h: 52px;
  --nav-h: 62px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: var(--font-ui);
  color: var(--ink);
  background: #d8d5ce;               /* фон вокруг «телефона» на десктопе */
}

/* Обёртка держит ширину (капается на 430px), высота считается ТОЛЬКО от
   ширины через классический padding-trick — без dvh/vh/JS, поэтому
   пропорция 390:844 не может "уехать" ни при каком окне/превью. */
.phone-frame {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
}
.phone-ratio-box {
  position: relative;
  width: 100%;
  padding-top: 216.410%; /* 844/390*100 */
}
.app {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Notch — присутствует на КАЖДОМ полноэкранном мокапе (spec §5) */
.notch {
  position: absolute;
  top: 9px; left: 50%;
  transform: translateX(-50%);
  width: 94.5px; height: 24px;
  background: #0A0A0A;
  border-radius: 12px;
  z-index: 20;
  pointer-events: none;
}

/* Прокручиваемая область контента (между верхом и нижней навигацией) */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ---------- ВЕРХНЯЯ СТРОКА (topbar) — spec §2 ---------- */
.topbar {
  display: flex;
  align-items: center;              /* все элементы на одной горизонтали */
  justify-content: space-between;
  gap: 8px;
  padding: 14px 20px;
  padding-top: max(44px, calc(14px + env(safe-area-inset-top)));
  min-height: var(--topbar-h);
}
.topbar__side {
  flex: 0 0 auto;
  width: 40px;
  display: flex;
  align-items: center;
}
.topbar__side--right { justify-content: flex-end; }
.topbar__title {
  flex: 1;
  text-align: center;
  font-family: var(--font-title);
  font-size: 26px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1;
}
.iconbtn {
  background: none;
  border: none;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
}
.iconbtn svg { display: block; }

.divider {
  height: 1px;
  background: var(--divider);
  border: none;
}

.meta-row {
  text-align: center;
  color: var(--muted);
  font-size: 15px;
  padding: 14px 0;
}

/* ---------- НИЖНЯЯ НАВИГАЦИЯ (spec §5) ---------- */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  border-top: 1px solid var(--divider-2);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg);
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0 12px;      /* иконки заметно ниже линии-разделителя */
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted-3);
  font-size: 12px;
  font-family: var(--font-ui);
  text-decoration: none;
}
.tab svg { display: block; }
.tab.is-active { color: var(--gold-text); }

/* ---------- КАРТОЧКИ-ПЛЕЙСХОЛДЕРЫ (spec §4, §5) ---------- */
/* Градиенты имитируют будущие фото. border-radius 10px. */
.ph {
  border-radius: 10px;
  position: relative;
  background: linear-gradient(180deg, #C9B68C 0%, #6E8C95 55%, #16323F 100%);
}
.ph--blue  { background: linear-gradient(180deg, #BFE0EE 0%, #5B879B 55%, #16323F 100%); }
.ph--teal  { background: linear-gradient(180deg, #9BC4D2 0%, #3E6B7C 60%, #16323F 100%); }

/* ---------- FAB (spec §5): 56×56, золотая, с тенью ---------- */
.fab {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gold);
  border: none;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(224,189,110,0.45);
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  border: 2px solid var(--bg);
}

/* доступность */
:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
<style>
  /* --- Upload progress-специфичное --- */
  .photo-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8.6px;
    padding: 6px 20px 18px;
  }
  .photo-grid .ph {
    flex: 0 0 calc((100% - 17.2px) / 3);
    aspect-ratio: 1 / 1.05;
  }

  .upload-card {
    margin: 6px 20px 0;
    background: var(--bg);
    border: 1px solid var(--divider-2);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 2px 14px rgba(28,28,26,0.05);
  }
  .upload-card__title {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .upload-item + .upload-item { margin-top: 16px; }
  .upload-item__row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .upload-item__name { font-weight: 500; }
  .upload-item__status { font-size: 14px; font-weight: 600; }
  .upload-item__status--done { color: #4C8B5A; }
  .upload-item__status--busy { color: var(--gold-text); }
  .upload-item__status--wait { color: var(--muted); }

  .upload-bar {
    height: 5px;
    border-radius: 3px;
    background: var(--divider-2);
    overflow: hidden;
  }
  .upload-bar__fill { height: 100%; border-radius: 3px; }
  .upload-bar__fill--done { width: 100%; background: #4C8B5A; }
  .upload-bar__fill--busy { width: 42%; background: var(--gold); }
  .upload-bar__fill--wait { width: 0%; background: var(--divider-2); }

  .upload-note {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 18px 32px 8px;
  }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <div class="notch"></div>
    <div class="screen">

      <!-- topbar: back / Ceremony (все на одной горизонтали) -->
      <div class="topbar">
        <div class="topbar__side">
          <a class="iconbtn" href="album.html" aria-label="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </a>
        </div>
        <div class="topbar__title">Ceremony</div>
        <div class="topbar__side topbar__side--right"></div>
      </div>
      <hr class="divider">
      <div class="meta-row">48 photos · 6 videos</div>

      <!-- превью первой строки сетки (контекст — куда идёт загрузка) -->
      <section class="photo-grid">
        <div class="ph"></div>
        <div class="ph--blue"></div>
        <div class="ph"></div>
      </section>

      <!-- Карточка прогресса загрузки -->
      <section class="upload-card">
        <div class="upload-card__title">Uploading 3 items&hellip;</div>

        <div class="upload-item">
          <div class="upload-item__row">
            <span class="upload-item__name">Photo &middot; IMG_0231.jpg</span>
            <span class="upload-item__status upload-item__status--done">Done</span>
          </div>
          <div class="upload-bar"><div class="upload-bar__fill upload-bar__fill--done"></div></div>
        </div>

        <div class="upload-item">
          <div class="upload-item__row">
            <span class="upload-item__name">Video &middot; VID_0042.mov</span>
            <span class="upload-item__status upload-item__status--busy">Compressing&hellip;</span>
          </div>
          <div class="upload-bar"><div class="upload-bar__fill upload-bar__fill--busy"></div></div>
        </div>

        <div class="upload-item">
          <div class="upload-item__row">
            <span class="upload-item__name">Photo &middot; IMG_0233.jpg</span>
            <span class="upload-item__status upload-item__status--wait">Waiting</span>
          </div>
          <div class="upload-bar"><div class="upload-bar__fill upload-bar__fill--wait"></div></div>
        </div>
      </section>

      <p class="upload-note">Videos are compressed automatically to save space</p>

    </div>

    <nav class="tabbar">
      <a class="tab" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        <span>Home</span>
      </a>
      <a class="tab is-active" href="albums.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg>
        <span>Albums</span>
      </a>
      <a class="tab" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <span>Search</span>
      </a>
      <a class="tab" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <span>Profile</span>
      </a>
    </nav>
  </main>
  </div>
</div>
</body>
</html>
