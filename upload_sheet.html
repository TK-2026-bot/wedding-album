<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add to Ceremony — Mallorca Wedding</title>
<style>
  @font-face {
    font-family: 'Marcellus';
    src: url(assets/fonts/marcellus.ttf) format('truetype');
    font-display: swap;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; }
  body {
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:#FEFEFD;
  }

  .phone-frame { width:100%; max-width:430px; margin:0 auto; }
  .phone-ratio-box { position:relative; width:100%; padding-top:216.410%; }

  .app {
    position:absolute; inset:0; width:100%; height:100%;
    background:#FEFEFD;
    overflow:hidden;
  }

  .app__bg {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .sheet {
    position:absolute; left:0; right:0; bottom:0; top:450px;
    background:#FEFEFD;
    border-radius:24px 24px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,0.15);
    padding:12px 24px 28px;
    display:flex; flex-direction:column;
  }
  .handle {
    width:36px; height:4px; border-radius:2px; background:#DCD8CE;
    margin:6px auto 18px;
  }
  .sheet h1 {
    font-family:'Marcellus', Georgia, serif;
    font-weight:400; font-size:26px; color:#1C1C1A;
    text-align:center; margin-bottom:20px;
  }

  .opt-row {
    display:flex; align-items:center; gap:16px;
    padding:16px 4px;
    background:none; border:none; width:100%;
    cursor:pointer; text-align:left;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  .opt-icon {
    flex:0 0 auto;
    width:48px; height:48px; border-radius:50%;
    background:#FBF3E0;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-label { font-size:17px; color:#1C1C1A; }
  .opt-divider { height:1px; background:#ECE8E0; margin:0 4px; }

  .cancel-btn {
    width:100%; height:52px; border:none; border-radius:16px;
    background:#F2EFE9; color:#6E6E69; font-size:17px; font-weight:700;
    cursor:pointer; margin-top:24px;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-ratio-box">
      <main class="app">
        <img class="app__bg" src="assets/img/upload-sheet.png" alt="">

        <div class="sheet">
          <div class="handle"></div>
          <h1>Add to Ceremony</h1>

          <button class="opt-row" href="upload.html">
            <span class="opt-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A88028" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </span>
            <span class="opt-label">Take Photo or Video</span>
          </a>

          <div class="opt-divider"></div>

          <button class="opt-row" href="upload.html">
            <span class="opt-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A88028" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
            </span>
            <span class="opt-label">Choose from Gallery</span>
          </a>

          <button class="cancel-btn" href="album.html">Cancel</a>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
