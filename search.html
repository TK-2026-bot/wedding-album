<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search — Mallorca Wedding</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  .search-box { padding: 4px 20px 12px; }
  .search-input {
    width: 100%; height: 46px;
    border: 1px solid var(--divider-2);
    border-radius: 23px;
    background: var(--bg-alt);
    padding: 0 18px;
    font-size: 16px;
    font-family: var(--font-ui);
    color: var(--ink);
    outline: none;
  }
  .search-input::placeholder { color: var(--muted); }

  .guest-list { padding: 0 8px 20px; }
  .guest-row {
    display: flex; align-items: center; gap: 14px;
    width: 100%;
    padding: 12px 12px;
    background: none; border: none;
    font-family: var(--font-ui);
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .guest-row + .guest-row { border-top: 1px solid var(--divider-2); }
  .guest-row:hover { background: var(--bg-alt); }
  .guest-row .avatar {
    width: 38px; height: 38px;
    background: var(--gold);
    color: var(--ink);
    font-size: 15px;
    border: none;
    flex: 0 0 auto;
  }

  .photo-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8.6px;
    padding: 6px 20px 20px;
  }
  .photo-grid .ph {
    flex: 0 0 calc((100% - 17.2px) / 3);
    aspect-ratio: 1 / 1.05;
    overflow: hidden;
  }
  .photo-grid .ph img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .play {
    position: absolute;
    right: 8px; bottom: 8px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    padding: 40px 32px;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <div class="notch"></div>
    <div class="screen">

      <div class="topbar">
        <div class="topbar__side">
          <button class="iconbtn" type="button" id="back-btn" aria-label="Back" style="display:none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
        </div>
        <div class="topbar__title" id="topbar-title" data-i18n="search.title">Search</div>
        <div class="topbar__side topbar__side--right"></div>
      </div>
      <hr class="divider">

      <div id="guests-view">
        <div class="search-box">
          <input class="search-input" id="search-input" type="text" placeholder="Search guests" data-i18n-placeholder="search.placeholder">
        </div>
        <div class="guest-list" id="guest-list"></div>
      </div>

      <div id="results-view" style="display:none;">
        <div class="meta-row" id="results-meta">…</div>
        <section class="photo-grid" id="results-grid"></section>
      </div>

    </div>

    <nav class="tabbar">
      <a class="tab" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a class="tab" href="albums.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg>
        <span data-i18n="nav.albums">Albums</span>
      </a>
      <a class="tab is-active" href="search.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <span data-i18n="nav.search">Search</span>
      </a>
      <a class="tab" href="profile.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>
  </main>
  </div>
  </div>

  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { listGuests, listPhotosByUploader } from "./js/data.js";
    import { applyTranslations, t, count } from "./js/i18n.js";

    applyTranslations();
    await requireAuth();

    const guests = await listGuests();

    const guestsView = document.getElementById("guests-view");
    const resultsView = document.getElementById("results-view");
    const guestList = document.getElementById("guest-list");
    const searchInput = document.getElementById("search-input");
    const backBtn = document.getElementById("back-btn");
    const topbarTitle = document.getElementById("topbar-title");
    const resultsMeta = document.getElementById("results-meta");
    const resultsGrid = document.getElementById("results-grid");

    function renderGuests(filterText) {
      const needle = filterText.trim().toLowerCase();
      const filtered = needle
        ? guests.filter((g) => (g.name || "").toLowerCase().includes(needle))
        : guests;

      if (!filtered.length) {
        guestList.innerHTML = `<p class="empty-state">${t("search.noGuests")}</p>`;
        return;
      }
      guestList.innerHTML = filtered
        .map(
          (g) => `<button type="button" class="guest-row" data-id="${g.id}">
            <span class="avatar">${(g.name || "?").charAt(0).toUpperCase()}</span>
            <span>${g.name || "Guest"}</span>
          </button>`
        )
        .join("");

      guestList.querySelectorAll(".guest-row").forEach((btn) => {
        btn.addEventListener("click", () => showResults(btn.dataset.id));
      });
    }

    searchInput.addEventListener("input", () => renderGuests(searchInput.value));
    renderGuests("");

    function renderResults(photos) {
      if (!photos.length) {
        resultsGrid.innerHTML = `<p class="empty-state">${t("search.noPhotos")}</p>`;
        return;
      }
      resultsGrid.innerHTML = photos
        .map((p) => {
          const play = p.type === "video"
            ? '<span class="play"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M7 5l12 7-12 7z"/></svg></span>'
            : "";
          return `<a class="ph" style="position:relative;text-decoration:none;display:block;" href="photo-viewer.html?albumId=${p.albumId}&photoId=${p.id}">
            <img src="${p.url}" loading="lazy" alt="">
            ${play}
          </a>`;
        })
        .join("");
    }

    async function showResults(uid) {
      const guest = guests.find((g) => g.id === uid);
      topbarTitle.textContent = guest?.name || "Guest";
      backBtn.style.display = "";
      guestsView.style.display = "none";
      resultsView.style.display = "";
      resultsMeta.textContent = t("common.loading");
      resultsGrid.innerHTML = "";

      const photos = await listPhotosByUploader(uid);
      const photoCount = photos.filter((p) => p.type !== "video").length;
      const videoCount = photos.filter((p) => p.type === "video").length;
      resultsMeta.textContent = `${count(photoCount, "photo")} · ${count(videoCount, "video")}`;
      renderResults(photos);
    }

    backBtn.addEventListener("click", () => {
      topbarTitle.textContent = t("search.title");
      backBtn.style.display = "none";
      resultsView.style.display = "none";
      guestsView.style.display = "";
    });
  </script>
</body>
</html>
