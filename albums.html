<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Albums — Mallorca Wedding</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  .albums-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 14px;
    padding-top: max(44px, calc(16px + env(safe-area-inset-top)));
  }
  .albums-head__title {
    font-family: var(--font-title);
    font-size: 34px;
    color: var(--ink);
  }
  .btn-new {
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 22px;
    padding: 11px 20px;
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-ui);
    cursor: pointer;
  }

  .albums-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 18px 20px 20px;
  }
  .album-card {
    flex: 1 1 calc(50% - 8px);
    min-width: calc(50% - 8px);
    height: 300px;
    border-radius: 14px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    text-decoration: none;
    overflow: hidden;
  }
  .album-card img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .album-card::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.45) 100%);
    z-index: 1;
  }
  .album-card__title {
    position: relative; z-index: 2;
    font-family: var(--font-title);
    font-size: 28px;
    color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.28);
    text-align: center;
  }
  .badge-count {
    position: absolute; z-index: 2;
    left: 14px; bottom: 14px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 14px;
  }
  .pin-toggle {
    position: absolute; z-index: 3;
    top: 12px; right: 12px;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-toggle.is-pinned { background: var(--gold); border-color: var(--gold); }
  .pin-toggle svg { display: block; }
  .empty-state { text-align: center; color: var(--muted); font-size: 15px; padding: 40px 32px; width: 100%; }

  .ph--mauve { background: linear-gradient(180deg, #C7A9B6 0%, #7C5866 55%, #2E1F27 100%); }
  .ph--green { background: linear-gradient(180deg, #AEC098 0%, #5E7049 55%, #2E3A22 100%); }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <div class="notch"></div>
    <div class="screen">

      <header class="albums-head">
        <h1 class="albums-head__title" data-i18n="albums.title">Albums</h1>
        <button class="btn-new" type="button" id="btn-new" onclick="window.location.href='new_album.html'" data-i18n="albums.new">+ New</button>
      </header>
      <hr class="divider">

      <section class="albums-grid" id="albums-grid">
        <p class="empty-state" data-i18n="common.loading">Loading…</p>
      </section>

    </div>

    <nav class="tabbar">
      <a class="tab" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a class="tab is-active" href="albums.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg>
        <span data-i18n="nav.albums">Albums</span>
      </a>
      <a class="tab" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <span data-i18n="nav.search">Search</span>
      </a>
      <a class="tab" href="profile.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>
  </main>
  </div>
</div>

  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { listAlbums, setAlbumPinned } from "./js/data.js";
    import { applyTranslations, t, count } from "./js/i18n.js";

    applyTranslations();
    await requireAuth();

    const PLACEHOLDER_CLASSES = ["ph", "ph--blue", "ph--teal", "ph--mauve", "ph--green"];
    const PIN_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8m0 0l4 4H8l4-4z"/><path d="M8 14l-3 7 7-3 7 3-3-7"/></svg>';

    const grid = document.getElementById("albums-grid");
    let albums = await listAlbums();

    function render() {
      if (!albums.length) {
        grid.innerHTML = `<p class="empty-state">${t("albums.empty")}</p>`;
        return;
      }
      grid.innerHTML = albums
        .map((a, i) => {
          const cls = PLACEHOLDER_CLASSES[i % PLACEHOLDER_CLASSES.length];
          const cover = a.coverUrl ? `<img src="${a.coverUrl}" alt="">` : "";
          const total = (a.photoCount || 0) + (a.videoCount || 0);
          return `<a class="album-card ${a.coverUrl ? "" : cls}" href="album.html?id=${a.id}">
            ${cover}
            <button type="button" class="pin-toggle ${a.pinned ? "is-pinned" : ""}" data-id="${a.id}" aria-label="Pin">${PIN_ICON}</button>
            <span class="badge-count">${count(total, "item")}</span>
            <span class="album-card__title">${a.name}</span>
          </a>`;
        })
        .join("");

      grid.querySelectorAll(".pin-toggle").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const album = albums.find((a) => a.id === btn.dataset.id);
          album.pinned = !album.pinned;
          render();
          await setAlbumPinned(album.id, album.pinned);
        });
      });
    }

    render();
  </script>
</body>
</html>
