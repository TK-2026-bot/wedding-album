<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Album — Mallorca Wedding</title>
<style>
  @font-face {
    font-family: 'Marcellus';
    src: url(assets/fonts/marcellus.ttf) format('truetype');
    font-display: swap;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; }
  body {
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:#FEFEFD;
  }

  .phone-frame { width:100%; max-width:430px; margin:0 auto; }
  .phone-ratio-box { position:relative; width:100%; padding-top:216.410%; }

  .app {
    position:absolute; inset:0; width:100%; height:100%;
    background:#8F9092;
    overflow:hidden;
  }


  .real-bg-dimmed {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block;
  }
  /* ---------- Notch ---------- */
  .notch {
    position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:94.5px; height:24px; background:#0A0A0A; border-radius:12px;
    z-index:10;
  }

  /* ---------- Bottom sheet ---------- */
  .sheet {
    position:absolute; top:373px; left:0; right:0; bottom:0;
    background:#FEFEFD;
    border-radius:24px 24px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,0.15);
    padding:12px 24px 32px;
    display:flex; flex-direction:column;
  }
  .handle {
    width:36px; height:4px; border-radius:2px; background:#DCD8CE;
    margin:6px auto 20px;
  }
  .sheet h1 {
    font-family:'Marcellus', Georgia, serif;
    font-weight:400; font-size:28px; color:#1C1C1A;
    text-align:center; margin-bottom:32px;
  }
  .field-label {
    font-size:12px; font-weight:600; letter-spacing:0.06em;
    color:#8C8880; text-transform:uppercase;
    margin-bottom:8px;
  }
  .name-input {
    width:100%; height:46px; border:1px solid #ECE8E0; border-radius:14px;
    background:#FCFBF9; padding:0 16px; margin-bottom:24px;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; color:#1C1C1A; outline:none;
  }
  .name-input::placeholder { color:#A6A29A; }

  .cover-row { display:flex; gap:12px; margin-bottom:28px; }
  .cover-card {
    flex:1; position:relative; border-radius:16px; padding:18px 12px 14px;
    text-align:center; cursor:pointer;
    border:1px solid #ECE8E0; background:#FEFEFD;
  }
  .cover-card--selected {
    border:1.5px solid #E0BD6E; background:#FBF3E0;
  }
  .cover-icon {
    width:44px; height:44px; border-radius:12px; margin:0 auto 10px;
  }
  .cover-icon--auto {
    background:linear-gradient(160deg,#C9B68C 0%,#6E8C95 55%,#16323F 100%);
  }
  .cover-icon--choose { background:#ECE7DC; }
  .cover-title { font-size:15px; font-weight:700; color:#1C1C1A; margin-bottom:2px; }
  .cover-sub { font-size:12px; color:#A6A29A; }
  .edit-badge {
    position:absolute; top:10px; right:10px; width:18px; height:18px;
    border-radius:50%; background:#E0BD6E;
    display:flex; align-items:center; justify-content:center;
  }

  .create-btn {
    width:100%; height:48px; border:none; border-radius:24px;
    background:#E0BD6E; color:#1C1C1A; font-size:17px; font-weight:700;
    cursor:pointer; margin-bottom:18px;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  .cancel-btn {
    background:none; border:none; text-align:center;
    font-size:15px; color:#8C8880; cursor:pointer;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-ratio-box">
      <main class="app">

        <img class="real-bg-dimmed" src="assets/img/new-album.png" alt="">

        <div class="sheet">
          <div class="handle"></div>
          <h1 data-i18n="newAlbum.title">New Album</h1>

          <div class="field-label" data-i18n="newAlbum.nameLabel">Album Name</div>
          <input class="name-input" id="album-name" type="text" placeholder="e.g. Beach Party" data-i18n-placeholder="newAlbum.namePlaceholder">

          <div class="field-label" data-i18n="newAlbum.coverLabel">Cover Photo</div>
          <div class="cover-row">
            <button type="button" class="cover-card cover-card--selected" id="cover-auto" data-mode="auto">
              <div class="edit-badge">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </div>
              <div class="cover-icon cover-icon--auto"></div>
              <div class="cover-title" data-i18n="newAlbum.auto">Auto</div>
              <div class="cover-sub" data-i18n="newAlbum.autoSub">First photo added</div>
            </button>
            <button type="button" class="cover-card" id="cover-choose" data-mode="choose">
              <div class="cover-icon cover-icon--choose"></div>
              <div class="cover-title" id="cover-choose-title" data-i18n="newAlbum.choose">Choose</div>
              <div class="cover-sub" id="cover-choose-sub" data-i18n="newAlbum.chooseSub">Pick a photo now</div>
            </button>
            <input type="file" id="cover-file" accept="image/*" hidden>
          </div>

          <button class="create-btn" type="button" id="create-btn" data-i18n="newAlbum.create">Create Album</button>
          <button class="cancel-btn" type="button" onclick="window.location.href='albums.html'" data-i18n="common.cancel">Cancel</button>
          <p class="login-error" id="new-album-error" style="color:#C24B3F;font-size:14px;text-align:center;"></p>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { createAlbum, uploadPhoto } from "./js/data.js";
    import { applyTranslations, t } from "./js/i18n.js";

    applyTranslations();
    await requireAuth();

    const autoCard = document.getElementById("cover-auto");
    const chooseCard = document.getElementById("cover-choose");
    const fileInput = document.getElementById("cover-file");
    const chooseSub = document.getElementById("cover-choose-sub");
    let coverMode = "auto";
    let coverFile = null;

    function selectMode(mode) {
      coverMode = mode;
      autoCard.classList.toggle("cover-card--selected", mode === "auto");
      chooseCard.classList.toggle("cover-card--selected", mode === "choose");
    }

    autoCard.addEventListener("click", () => selectMode("auto"));
    chooseCard.addEventListener("click", () => {
      selectMode("choose");
      fileInput.click();
    });
    fileInput.addEventListener("change", () => {
      coverFile = fileInput.files[0] || null;
      chooseSub.textContent = coverFile ? coverFile.name : t("newAlbum.chooseSub");
    });

    const nameInput = document.getElementById("album-name");
    const createBtn = document.getElementById("create-btn");
    const errorEl = document.getElementById("new-album-error");

    createBtn.addEventListener("click", async () => {
      const name = nameInput.value.trim();
      if (!name) {
        errorEl.textContent = t("newAlbum.errNoName");
        return;
      }
      errorEl.textContent = "";
      createBtn.disabled = true;
      createBtn.textContent = t("newAlbum.creating");
      try {
        const albumId = await createAlbum(name);
        if (coverMode === "choose" && coverFile) {
          await uploadPhoto(albumId, coverFile);
        }
        window.location.href = `album.html?id=${albumId}`;
      } catch {
        errorEl.textContent = t("newAlbum.errCreate");
        createBtn.disabled = false;
        createBtn.textContent = t("newAlbum.create");
      }
    });
  </script>
</body>
</html>
