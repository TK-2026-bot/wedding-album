<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Select — Mallorca Wedding</title>
<style>
  @font-face {
    font-family: 'Marcellus';
    src: url(assets/fonts/marcellus.ttf) format('truetype');
    font-display: swap;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:#1C1C1A;
    background:#d8d5ce;
    display:flex; justify-content:center; align-items:center;
  }

  .app {
    position:relative;
    height:100dvh; max-height:100dvh;
    width:auto; max-width:430px;
    aspect-ratio: 390 / 844;
    margin:auto;
    background:#FEFEFD;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .screen { flex:1; display:flex; flex-direction:column; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:14px 20px;
    padding-top:calc(14px + env(safe-area-inset-top));
    min-height:52px;
  }
  /* NOTE: for iPhone-frame presentation screenshots, override .topbar padding-top to 44px
     (simulated notch clearance) to match page3/5 reference exactly. Real devices use env() above. */
  .topbar__side { flex:0 0 auto; min-width:44px; display:flex; align-items:center; }
  .topbar__side--right { justify-content:flex-end; }
  .topbar__title {
    flex:1; text-align:center;
    font-family:'Marcellus', Georgia, serif;
    font-size:26px; font-weight:400; color:#1C1C1A; line-height:1;
  }
  .iconbtn { background:none; border:none; color:#1C1C1A; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:4px; }
  .iconbtn svg { display:block; }
  .btn-text {
    background:none; border:none; cursor:pointer;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; font-weight:600; color:#A88028;
    padding:4px; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center;
    line-height:1;
    margin-top:9px;
  }

  .divider { height:1px; background:#E5E1D8; border:none; }

  .select-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
  }
  .select-row__count { font-size:15px; color:#1C1C1A; }
  .select-row__all {
    background:none; border:none; cursor:pointer;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:15px; font-weight:600; color:#A88028;
  }

  .photo-grid { display:flex; flex-wrap:wrap; gap:8.6px; padding:6px 20px 20px; }
  .photo-grid .tile {
    position:relative;
    flex:0 0 calc((100% - 17.2px) / 3);
    aspect-ratio:1 / 1.05;
    border-radius:10px;
    overflow:hidden;
  }
  .ph  { background:linear-gradient(180deg,#C9B68C 0%,#6E8C95 55%,#16323F 100%); }
  .ph--blue { background:linear-gradient(180deg,#BFE0EE 0%,#5B879B 55%,#16323F 100%); }
  .ph--teal { background:linear-gradient(180deg,#9BC4D2 0%,#3E6B7C 60%,#16323F 100%); }

  .tile__check {
    position:absolute; top:8px; right:8px;
    width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .tile__check--on { background:#E0BD6E; box-shadow:0 1px 4px rgba(0,0,0,0.25); }
  .tile__check--off { background:rgba(0,0,0,0.08); border:2px solid rgba(255,255,255,0.9); }

  .ms-actionbar {
    flex:0 0 auto; display:flex;
    background:#FEFEFD;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid #ECE8E0;
  }
  .ms-action {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    font-size:12px; font-weight:400; color:#A6A29A;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  .ms-action--delete { color:#C24B3F; }
  .ms-action svg { display:block; }
</style>
</head>
<body>
  <main class="app">
    <div class="screen">

      <div class="topbar">
        <div class="topbar__side">
          <button class="iconbtn" aria-label="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
        </div>
        <div class="topbar__title"><a href="album.html" style="text-decoration:none;color:inherit;">←</a>
        <span style="flex:1;text-align:center;">Ceremony</span></div>
        <div class="topbar__side topbar__side--right">
          <button class="btn-text">Cancel</button>
        </div>
      </div>
      <hr class="divider">

      <div class="select-row">
        <span class="select-row__count">10 selected</span>
        <button class="select-row__all">Select all</button>
      </div>

      <section class="photo-grid">
        <div class="tile ph"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
        <div class="tile ph--blue"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
        <div class="tile ph"><span class="tile__check tile__check--off"></span></div>

        <div class="tile ph--blue"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
        <div class="tile ph"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
        <div class="tile ph--teal"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>

        <div class="tile ph"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
        <div class="tile ph--blue"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
        <div class="tile ph"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>

        <div class="tile ph--blue"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
        <div class="tile ph"><span class="tile__check tile__check--on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
      </section>

    </div>

    <footer class="ms-actionbar">
      <button class="ms-action">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0l-4-4m4 4l4-4"/><path d="M5 18h14"/></svg>
        Save
      </button>
      <button class="ms-action">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11m0 0l-3-3m3 3l-3 3"/><path d="M20 17H9m0 0l3-3m-3 3l3 3"/></svg>
        Move to&hellip;
      </button>
      <button class="ms-action ms-action--delete">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5A1.5 1.5 0 0110.5 3h3A1.5 1.5 0 0115 4.5V7"/><path d="M18.5 7l-.8 12.1a2 2 0 01-2 1.9H8.3a2 2 0 01-2-1.9L5.5 7"/><path d="M10 11v6M14 11v6"/></svg>
        Delete
      </button>
    </footer>

  </main>
</body>
</html>
