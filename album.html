<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Album — Mallorca Wedding</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  .photo-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8.6px;
    padding: 6px 20px 20px;
  }
  .photo-grid .ph {
    flex: 0 0 calc((100% - 17.2px) / 3);
    aspect-ratio: 1 / 1.05;
    overflow: hidden;
  }
  .photo-grid .ph img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .play {
    position: absolute;
    right: 8px; bottom: 8px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    padding: 40px 32px;
  }

  .album-footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 20px;
  }
  .recently__label { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .recently__avatars { display: flex; }
  .recently__avatars .avatar { margin-left: -8px; }
  .recently__avatars .avatar:first-child { margin-left: 0; }

  /* ---------- Шторка загрузки (overlay) ---------- */
  .sheet-scrim {
    position: absolute; inset: 0;
    background: rgba(20,22,24,0.45);
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease;
    z-index: 20;
  }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 26px 26px 0 0;
    padding: 12px 24px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    z-index: 21;
  }
  .sheet-scrim.is-open { opacity: 1; visibility: visible; }
  .sheet-scrim.is-open .sheet { transform: translateY(0); }
  .sheet__handle { width: 40px; height: 4px; background: #DEDAD2; border-radius: 3px; margin: 0 auto 20px; }
  .sheet__title { font-family: var(--font-title); font-size: 24px; text-align: center; margin-bottom: 22px; }
  .sheet__opt {
    display: flex; align-items: center; gap: 18px;
    padding: 16px 0;
    background: none; border: none; width: 100%;
    font-size: 18px; color: var(--ink); font-family: var(--font-ui);
    cursor: pointer; text-align: left;
  }
  .sheet__opt + .sheet__opt { border-top: 1px solid var(--divider-2); }
  .sheet__ic {
    width: 48px; height: 48px; border-radius: 50%;
    background: #FBF6EA;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-text); flex: 0 0 auto;
  }
  .sheet__cancel {
    width: 100%; margin-top: 18px;
    background: #F1EDE5; border: none; border-radius: 16px;
    padding: 16px; font-size: 16px; font-weight: 700; color: var(--muted-2);
    font-family: var(--font-ui); cursor: pointer;
  }

  /* ---------- Upload progress panel ---------- */
  .upload-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--divider-2);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.08);
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .25s ease;
    z-index: 22;
    max-height: 55%;
    overflow-y: auto;
  }
  .upload-panel.is-open { transform: translateY(0); }
  .upload-panel__title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .upload-item + .upload-item { margin-top: 12px; }
  .upload-item__row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; margin-bottom: 6px;
  }
  .upload-item__status--done { color: #4C8B5A; }
  .upload-item__status--busy { color: var(--gold-text); }
  .upload-item__status--error { color: var(--danger); }
  .upload-bar { height: 5px; border-radius: 3px; background: var(--divider-2); overflow: hidden; }
  .upload-bar__fill { height: 100%; border-radius: 3px; background: var(--gold); transition: width .2s ease; }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <div class="notch"></div>
    <div class="screen">

      <div class="topbar">
        <div class="topbar__side">
          <a class="iconbtn" href="albums.html" aria-label="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </a>
        </div>
        <div class="topbar__title" id="album-title">…</div>
        <div class="topbar__side topbar__side--right">
          <button class="iconbtn" type="button" aria-label="Select" id="select-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
          </button>
        </div>
      </div>
      <hr class="divider">
      <div class="meta-row" id="album-meta" data-i18n="common.loading">Loading…</div>

      <section class="photo-grid" id="photo-grid"></section>

      <footer class="album-footer">
        <div class="recently">
          <div class="recently__label" data-i18n="album.recentlyAddedBy">Recently added by</div>
          <div class="recently__avatars" id="recently-avatars"></div>
        </div>
        <button class="fab" type="button" aria-label="Add photo or video" onclick="openSheet()">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </footer>

    </div>

    <nav class="tabbar">
      <a class="tab" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a class="tab is-active" href="albums.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg>
        <span data-i18n="nav.albums">Albums</span>
      </a>
      <a class="tab" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <span data-i18n="nav.search">Search</span>
      </a>
      <a class="tab" href="profile.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>

    <!-- Шторка «Add to <album>» -->
    <div class="sheet-scrim" id="scrim" onclick="if(event.target===this)closeSheet()">
      <div class="sheet" role="dialog" aria-label="Add to album">
        <div class="sheet__handle"></div>
        <div class="sheet__title" data-i18n="album.sheetTitle">Add photos</div>
        <button class="sheet__opt" type="button" id="opt-camera">
          <span class="sheet__ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="3.4"/><path d="M8 7l1.5-2.5h5L16 7"/></svg></span>
          <span data-i18n="album.takePhoto">Take Photo or Video</span>
        </button>
        <button class="sheet__opt" type="button" id="opt-gallery">
          <span class="sheet__ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2.5 4 3.5"/></svg></span>
          <span data-i18n="album.chooseGallery">Choose from Gallery</span>
        </button>
        <button class="sheet__cancel" type="button" onclick="closeSheet()" data-i18n="common.cancel">Cancel</button>
      </div>
    </div>

    <input type="file" id="file-camera" accept="image/*,video/*" capture="environment" hidden>
    <input type="file" id="file-gallery" accept="image/*,video/*" multiple hidden>

    <div class="upload-panel" id="upload-panel">
      <div class="upload-panel__title" id="upload-panel-title">Uploading…</div>
      <div id="upload-items"></div>
    </div>
  </main>
  </div>
  </div>

  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { getAlbum, listPhotos, uploadPhoto } from "./js/data.js";
    import { applyTranslations, t, count } from "./js/i18n.js";
    import { compressImage } from "./js/media.js";

    applyTranslations();
    await requireAuth();

    const params = new URLSearchParams(window.location.search);
    const albumId = params.get("id");
    if (!albumId) {
      window.location.href = "albums.html";
      throw new Error("Missing album id");
    }

    window.openSheet = () => document.getElementById("scrim").classList.add("is-open");
    window.closeSheet = () => document.getElementById("scrim").classList.remove("is-open");

    document.getElementById("select-btn").addEventListener("click", () => {
      window.location.href = `multiselect.html?id=${albumId}`;
    });

    const grid = document.getElementById("photo-grid");
    const titleEl = document.getElementById("album-title");
    const metaEl = document.getElementById("album-meta");
    const avatarsEl = document.getElementById("recently-avatars");

    const AVATAR_COLORS = ["#8FAEB8", "#B9A98F", "#3E6B82", "#C9A0A0", "#7C9473"];

    function renderPhotos(photos) {
      if (!photos.length) {
        grid.innerHTML = `<p class="empty-state">${t("album.emptyPhotos")}</p>`;
        return;
      }
      grid.innerHTML = photos
        .map((p, i) => {
          const cls = i % 3 === 1 ? "ph ph--blue" : i % 3 === 2 ? "ph ph--teal" : "ph";
          const play = p.type === "video"
            ? '<span class="play"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M7 5l12 7-12 7z"/></svg></span>'
            : "";
          return `<a class="${cls}" style="position:relative;text-decoration:none;display:block;" href="photo-viewer.html?albumId=${albumId}&photoId=${p.id}">
            <img src="${p.url}" loading="lazy" alt="">
            ${play}
          </a>`;
        })
        .join("");
    }

    function renderAvatars(photos) {
      const seen = new Map();
      for (const p of photos) {
        if (p.uploadedByName && !seen.has(p.uploadedByName)) {
          seen.set(p.uploadedByName, true);
        }
        if (seen.size >= 3) break;
      }
      const names = [...seen.keys()];
      avatarsEl.innerHTML = names
        .map((n, i) => `<span class="avatar" style="background:${AVATAR_COLORS[i % AVATAR_COLORS.length]}">${n.charAt(0).toUpperCase()}</span>`)
        .join("");
    }

    let photosCache = [];

    async function refresh() {
      const [album, photos] = await Promise.all([getAlbum(albumId), listPhotos(albumId)]);
      if (!album) {
        window.location.href = "albums.html";
        return;
      }
      titleEl.textContent = album.name;
      document.title = `${album.name} — Mallorca Wedding`;
      const photoCount = photos.filter((p) => p.type !== "video").length;
      const videoCount = photos.filter((p) => p.type === "video").length;
      metaEl.textContent = `${count(photoCount, "photo")} · ${count(videoCount, "video")}`;
      photosCache = photos;
      renderPhotos(photos);
      renderAvatars(photos);
    }

    refresh();

    // ---- Upload flow ----
    const uploadPanel = document.getElementById("upload-panel");
    const uploadItems = document.getElementById("upload-items");
    const uploadPanelTitle = document.getElementById("upload-panel-title");

    document.getElementById("opt-camera").addEventListener("click", () => {
      closeSheet();
      document.getElementById("file-camera").click();
    });
    document.getElementById("opt-gallery").addEventListener("click", () => {
      closeSheet();
      document.getElementById("file-gallery").click();
    });

    async function handleFiles(fileList) {
      const files = [...fileList];
      if (!files.length) return;

      uploadPanelTitle.textContent = `${t("album.uploading")} ${count(files.length, "item")}…`;
      uploadItems.innerHTML = files
        .map(
          (f, i) => `<div class="upload-item" id="upload-item-${i}">
            <div class="upload-item__row">
              <span>${f.name}</span>
              <span class="upload-item__status upload-item__status--busy" id="upload-status-${i}">0%</span>
            </div>
            <div class="upload-bar"><div class="upload-bar__fill" id="upload-fill-${i}" style="width:0%"></div></div>
          </div>`
        )
        .join("");
      uploadPanel.classList.add("is-open");

      await Promise.all(
        files.map(async (file, i) => {
          const statusEl = document.getElementById(`upload-status-${i}`);
          try {
            if (file.type.startsWith("image/")) {
              statusEl.textContent = t("album.compressing");
              file = await compressImage(file);
            }
            await uploadPhoto(albumId, file, (fraction) => {
              document.getElementById(`upload-fill-${i}`).style.width = `${Math.round(fraction * 100)}%`;
              statusEl.textContent = `${Math.round(fraction * 100)}%`;
            });
            statusEl.textContent = t("album.uploadDone");
            statusEl.className = "upload-item__status upload-item__status--done";
          } catch {
            statusEl.textContent = t("album.uploadFailed");
            statusEl.className = "upload-item__status upload-item__status--error";
          }
        })
      );

      await refresh();
      setTimeout(() => uploadPanel.classList.remove("is-open"), 1200);
    }

    document.getElementById("file-camera").addEventListener("change", (e) => {
      handleFiles(e.target.files);
      e.target.value = "";
    });
    document.getElementById("file-gallery").addEventListener("change", (e) => {
      handleFiles(e.target.files);
      e.target.value = "";
    });
  </script>
</body>
</html>
