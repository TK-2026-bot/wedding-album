<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ceremony — Mallorca Wedding</title>
<style>
/* ============================================================
   Mallorca Wedding App — Design system (styles.css)
   Значения строго по DESIGN_SPEC_reference.md
   ============================================================ */

@font-face {
    font-family: 'Marcellus';
    src: url(assets/fonts/marcellus.ttf) format('truetype');
    font-display: swap;
  }

:root {
  /* Палитра (spec §4) */
  --bg:            #FEFEFD;
  --bg-alt:        #FCFBF9;
  --gold:          #E0BD6E;   /* акцент: кнопки, индикаторы, активный таб */
  --gold-text:     #A88028;   /* золотой текст на светлом фоне */
  --ink:           #1C1C1A;   /* основной текст */
  --muted:         #8C8880;   /* приглушённый */
  --muted-2:       #6E6E69;
  --muted-3:       #A6A29A;   /* неактивные иконки */
  --divider:       #E5E1D8;
  --divider-2:     #ECE8E0;
  --danger:        #C24B3F;   /* Delete */

  /* Типографика */
  --font-title: 'Marcellus', Georgia, serif;              /* заголовки экранов */
  --font-ui: -apple-system, "Helvetica Neue", Arial, sans-serif;

  /* Метрики (spec §2, §5) */
  --topbar-h: 52px;
  --nav-h: 62px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: var(--font-ui);
  color: var(--ink);
  background: #d8d5ce;               /* фон вокруг «телефона» на десктопе */
}

/* Обёртка держит ширину (капается на 430px), высота считается ТОЛЬКО от
   ширины через классический padding-trick — без dvh/vh/JS, поэтому
   пропорция 390:844 не может "уехать" ни при каком окне/превью. */
.phone-frame {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
}
.phone-ratio-box {
  position: relative;
  width: 100%;
  padding-top: 216.410%; /* 844/390*100 */
}
.app {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Notch — присутствует на КАЖДОМ полноэкранном мокапе (spec §5) */
.notch {
  position: absolute;
  top: 9px; left: 50%;
  transform: translateX(-50%);
  width: 94.5px; height: 24px;
  background: #0A0A0A;
  border-radius: 12px;
  z-index: 20;
  pointer-events: none;
}

/* Прокручиваемая область контента (между верхом и нижней навигацией) */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ---------- ВЕРХНЯЯ СТРОКА (topbar) — spec §2 ---------- */
.topbar {
  display: flex;
  align-items: center;              /* все элементы на одной горизонтали */
  justify-content: space-between;
  gap: 8px;
  padding: 14px 20px;
  padding-top: max(44px, calc(14px + env(safe-area-inset-top)));
  min-height: var(--topbar-h);
}
.topbar__side {
  flex: 0 0 auto;
  width: 40px;
  display: flex;
  align-items: center;
}
.topbar__side--right { justify-content: flex-end; }
.topbar__title {
  flex: 1;
  text-align: center;
  font-family: var(--font-title);
  font-size: 26px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1;
}
.iconbtn {
  background: none;
  border: none;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
}
.iconbtn svg { display: block; }

.divider {
  height: 1px;
  background: var(--divider);
  border: none;
}

.meta-row {
  text-align: center;
  color: var(--muted);
  font-size: 15px;
  padding: 14px 0;
}

/* ---------- НИЖНЯЯ НАВИГАЦИЯ (spec §5) ---------- */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  border-top: 1px solid var(--divider-2);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg);
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0 12px;      /* иконки заметно ниже линии-разделителя */
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted-3);
  font-size: 12px;
  font-family: var(--font-ui);
  text-decoration: none;
}
.tab svg { display: block; }
.tab.is-active { color: var(--gold-text); }

/* ---------- КАРТОЧКИ-ПЛЕЙСХОЛДЕРЫ (spec §4, §5) ---------- */
/* Градиенты имитируют будущие фото. border-radius 10px. */
.ph {
  border-radius: 10px;
  position: relative;
  background: linear-gradient(180deg, #C9B68C 0%, #6E8C95 55%, #16323F 100%);
}
.ph--blue  { background: linear-gradient(180deg, #BFE0EE 0%, #5B879B 55%, #16323F 100%); }
.ph--teal  { background: linear-gradient(180deg, #9BC4D2 0%, #3E6B7C 60%, #16323F 100%); }

/* ---------- FAB (spec §5): 56×56, золотая, с тенью ---------- */
.fab {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gold);
  border: none;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(224,189,110,0.45);
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  border: 2px solid var(--bg);
}

/* доступность */
:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
<style>
  .photo-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8.6px;
    padding: 6px 20px 20px;
  }
  .photo-grid .ph {
    flex: 0 0 calc((100% - 17.2px) / 3);
    aspect-ratio: 1 / 1.05;
  }
  .play {
    position: absolute;
    right: 8px; bottom: 8px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
  }

  .album-footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 20px;
  }
  .recently__label { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .recently__avatars { display: flex; }
  .recently__avatars .avatar { margin-left: -8px; }
  .recently__avatars .avatar:first-child { margin-left: 0; }

  /* ---------- Шторка загрузки (overlay) ---------- */
  .sheet-scrim {
    position: absolute; inset: 0;
    background: rgba(20,22,24,0.45);
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease;
    z-index: 20;
  }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 26px 26px 0 0;
    padding: 12px 24px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    z-index: 21;
  }
  .sheet-scrim.is-open { opacity: 1; visibility: visible; }
  .sheet-scrim.is-open .sheet { transform: translateY(0); }
  .sheet__handle { width: 40px; height: 4px; background: #DEDAD2; border-radius: 3px; margin: 0 auto 20px; }
  .sheet__title { font-family: var(--font-title); font-size: 24px; text-align: center; margin-bottom: 22px; }
  .sheet__opt {
    display: flex; align-items: center; gap: 18px;
    padding: 16px 0;
    background: none; border: none; width: 100%;
    font-size: 18px; color: var(--ink); font-family: var(--font-ui);
    cursor: pointer; text-align: left;
  }
  .sheet__opt + .sheet__opt { border-top: 1px solid var(--divider-2); }
  .sheet__ic {
    width: 48px; height: 48px; border-radius: 50%;
    background: #FBF6EA;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-text); flex: 0 0 auto;
  }
  .sheet__cancel {
    width: 100%; margin-top: 18px;
    background: #F1EDE5; border: none; border-radius: 16px;
    padding: 16px; font-size: 16px; font-weight: 700; color: var(--muted-2);
    font-family: var(--font-ui); cursor: pointer;
  }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <div class="notch"></div>
    <div class="screen">

      <!-- topbar: back / Ceremony / ••• (все на одной горизонтали) -->
      <div class="topbar">
        <div class="topbar__side">
          <a class="iconbtn" href="albums.html" aria-label="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </a>
        </div>
        <div class="topbar__title">Ceremony</div>
        <div class="topbar__side topbar__side--right">
          <button class="iconbtn" type="button" aria-label="More" onclick="alert('Select — режим множественного выбора')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
          </a>
        </div>
      </div>
      <hr class="divider">
      <div class="meta-row">48 photos · 6 videos</div>

      <!-- сетка 3 колонки, play на видео -->
      <section class="photo-grid">
        <a class="ph" href="photo-viewer.html" style="text-decoration:none;display:block;"></a>
        <a class="ph ph--blue" href="photo-viewer.html" style="text-decoration:none;display:block;"></a>
        <a class="ph" href="photo-viewer.html" style="text-decoration:none;display:block;"><span class="play"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M7 5l12 7-12 7z"/></svg></span></a>
        <button class="ph ph--teal" href="photo-viewer.html" style="border:none;background:inherit;cursor:pointer;"></a>
        <a class="ph" href="photo-viewer.html" style="text-decoration:none;display:block;"></a>
        <a class="ph ph--blue" href="photo-viewer.html" style="text-decoration:none;display:block;"></a>
        <a class="ph" href="photo-viewer.html" style="text-decoration:none;display:block;"><span class="play"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M7 5l12 7-12 7z"/></svg></span></a>
        <a class="ph ph--blue" href="photo-viewer.html" style="text-decoration:none;display:block;"></a>
        <a class="ph" href="photo-viewer.html" style="text-decoration:none;display:block;"></a>
        <a class="ph ph--teal" href="photo-viewer.html" style="text-decoration:none;display:block;"><span class="play"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M7 5l12 7-12 7z"/></svg></span></a>
        <a class="ph" href="photo-viewer.html" style="text-decoration:none;display:block;"></a>
      </section>

      <!-- Recently added by + FAB -->
      <footer class="album-footer">
        <div class="recently">
          <div class="recently__label">Recently added by</div>
          <div class="recently__avatars">
            <span class="avatar" style="background:#8FAEB8">M</span>
            <span class="avatar" style="background:#B9A98F">C</span>
            <span class="avatar" style="background:#3E6B82">A</span>
          </div>
        </div>
        <button class="fab" href="upload_sheet.html" style="cursor:pointer;" type="button" aria-label="Add photo or video" onclick="openSheet()">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </a>
      </footer>

    </div>

    <nav class="tabbar">
      <a class="tab" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        <span>Home</span>
      </a>
      <a class="tab is-active" href="albums.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg>
        <span>Albums</span>
      </a>
      <a class="tab" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <span>Search</span>
      </a>
      <a class="tab" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <span>Profile</span>
      </a>
    </nav>

    <!-- Шторка «Add to Ceremony» -->
    <div class="sheet-scrim" id="scrim" onclick="if(event.target===this)closeSheet()">
      <div class="sheet" role="dialog" aria-label="Add to Ceremony">
        <div class="sheet__handle"></div>
        <div class="sheet__title">Add to Ceremony</div>
        <button class="sheet__opt" type="button">
          <span class="sheet__ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="3.4"/><path d="M8 7l1.5-2.5h5L16 7"/></svg></span>
          Take Photo or Video
        </a>
        <button class="sheet__opt" type="button">
          <span class="sheet__ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2.5 4 3.5"/></svg></span>
          Choose from Gallery
        </a>
        <button class="sheet__cancel" type="button" onclick="closeSheet()">Cancel</a>
      </div>
    </div>
  </main>
  </div>
</div>

  <script>
    function openSheet(){ document.getElementById('scrim').classList.add('is-open'); }
    function closeSheet(){ document.getElementById('scrim').classList.remove('is-open'); }
  </script>
</body>
</html>
