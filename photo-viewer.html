<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo — Mallorca Wedding</title>
<style>
  @font-face {
    font-family: 'Marcellus';
    src: url(assets/fonts/marcellus.ttf) format('truetype');
    font-display: swap;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#0d1418; }
  body {
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:#1C1C1A;
    display:flex; justify-content:center; align-items:center;
  }

  .app {
    position:relative;
    height:100dvh; max-height:100dvh;
    width:auto; max-width:430px;
    aspect-ratio: 390 / 844;
    margin:auto;
    background:#0d1418;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .viewer {
    position:relative;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
    background:linear-gradient(180deg,#C9B68C 0%,#6E8C95 45%,#16323F 100%);
    overflow:hidden;
  }

  .viewer__scrim-top {
    position:absolute; top:0; left:0; right:0; height:170px;
    background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.28) 55%, rgba(0,0,0,0) 100%);
    pointer-events:none;
    z-index: 1;
  }

  .viewer__top {
    position:relative; z-index:2;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .viewer__back {
    background:none; border:none; color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; padding:4px; line-height:0;
  }
  .viewer__user { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .viewer__avatar {
    width:34px; height:34px; border-radius:50%;
    background:#8FAEB8; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600;
    flex:0 0 auto;
  }
  .viewer__user-text { min-width:0; }
  .viewer__name {
    font-family:'Marcellus', Georgia, serif;
    font-weight:400; font-size:17px;
    color:#fff; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .viewer__meta {
    font-size:12.5px; color:rgba(255,255,255,0.75); line-height:1.3; margin-top:1px;
  }

  .viewer__counter {
    position:relative; z-index:2; text-align:center;
    font-size:13px; font-weight:600;
    color:rgba(255,255,255,0.85);
    letter-spacing:0.02em;
    margin-top:2px;
  }

  .viewer__nav {
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.65);
    background:none; border:none; cursor:pointer;
  }
  .viewer__nav--prev { left:6px; }
  .viewer__nav--next { right:6px; }
  .viewer__nav[hidden] { display:none; }

  .viewer__body {
    flex:1;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  .viewer__body img, .viewer__body video {
    max-width:100%; max-height:100%;
    object-fit:contain;
  }

  .viewer-actionbar {
    flex:0 0 auto;
    display:flex;
    background:#FEFEFD;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid #ECE8E0;
  }
  .viewer-action {
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    font-size:12px; font-weight:400;
    color:#A6A29A;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  .viewer-action--delete { color:#C24B3F; }
  .viewer-action svg { display:block; }
  .viewer-action:disabled { opacity: .4; cursor: default; }

  .move-overlay {
    position:absolute; inset:0; z-index:5;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:flex-end;
  }
  .move-overlay.is-open { display:flex; }
  .move-sheet {
    width:100%; background:#FEFEFD; border-radius:20px 20px 0 0;
    padding:20px 24px calc(24px + env(safe-area-inset-bottom));
  }
  .move-sheet h2 { font-family:'Marcellus', Georgia, serif; font-size:20px; margin-bottom:14px; text-align:center; }
  .move-sheet select {
    width:100%; padding:14px; border-radius:12px; border:1px solid #ECE8E0;
    font-size:16px; margin-bottom:14px;
  }
  .move-sheet button {
    width:100%; padding:14px; border:none; border-radius:14px;
    font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .move-confirm { background:#E0BD6E; color:#1C1C1A; margin-bottom:10px; }
  .move-cancel { background:#F1EDE5; color:#6E6E69; }
</style>
</head>
<body>
  <main class="app">

    <div class="viewer">
      <div class="viewer__scrim-top"></div>

      <div class="viewer__top">
        <button class="viewer__back" aria-label="Back" id="back-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="viewer__user">
          <span class="viewer__avatar" id="viewer-avatar">?</span>
          <div class="viewer__user-text">
            <div class="viewer__name" id="viewer-name">…</div>
            <div class="viewer__meta" id="viewer-meta"></div>
          </div>
        </div>
      </div>

      <div class="viewer__counter" id="viewer-counter"></div>

      <button class="viewer__nav viewer__nav--prev" id="nav-prev" aria-label="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="viewer__nav viewer__nav--next" id="nav-next" aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>

      <div class="viewer__body" id="viewer-body"></div>

      <div class="move-overlay" id="move-overlay">
        <div class="move-sheet">
          <h2 data-i18n="viewer.moveTitle">Move to…</h2>
          <select id="move-select"></select>
          <button class="move-confirm" id="move-confirm" type="button" data-i18n="common.move">Move</button>
          <button class="move-cancel" id="move-cancel" type="button" data-i18n="common.cancel">Cancel</button>
        </div>
      </div>
    </div>

    <footer class="viewer-actionbar">
      <button class="viewer-action" id="action-save">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0l-4-4m4 4l4-4"/><path d="M5 18h14"/></svg>
        <span data-i18n="common.save">Save</span>
      </button>
      <button class="viewer-action" id="action-share">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0l-3.5 3.5M12 4l3.5 3.5"/><path d="M5 12v6.5a1.5 1.5 0 001.5 1.5h11a1.5 1.5 0 001.5-1.5V12"/></svg>
        <span data-i18n="common.share">Share</span>
      </button>
      <button class="viewer-action" id="action-cover" style="display:none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2.5 4 3.5"/></svg>
        <span data-i18n="album.setCover">Set Cover</span>
      </button>
      <button class="viewer-action" id="action-move" style="display:none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11m0 0l-3-3m3 3l-3 3"/><path d="M20 17H9m0 0l3-3m-3 3l3 3"/></svg>
        <span data-i18n="common.move">Move</span>
      </button>
      <button class="viewer-action viewer-action--delete" id="action-delete" style="display:none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5A1.5 1.5 0 0110.5 3h3A1.5 1.5 0 0115 4.5V7"/><path d="M18.5 7l-.8 12.1a2 2 0 01-2 1.9H8.3a2 2 0 01-2-1.9L5.5 7"/><path d="M10 11v6M14 11v6"/></svg>
        <span data-i18n="common.delete">Delete</span>
      </button>
    </footer>

  </main>

  <script type="module">
    import { requireAuth, isAdmin } from "./js/auth.js";
    import { listPhotos, deletePhoto, movePhoto, listAlbums, setAlbumCover } from "./js/data.js";
    import { applyTranslations, t, getLang } from "./js/i18n.js";

    applyTranslations();
    await requireAuth();
    if (isAdmin()) {
      document.getElementById("action-move").style.display = "";
      document.getElementById("action-delete").style.display = "";
      document.getElementById("action-cover").style.display = "";
    }

    const params = new URLSearchParams(window.location.search);
    const albumId = params.get("albumId");
    let photoId = params.get("photoId");
    if (!albumId || !photoId) {
      window.location.href = "albums.html";
      throw new Error("Missing albumId/photoId");
    }

    document.getElementById("back-btn").addEventListener("click", () => {
      window.location.href = `album.html?id=${albumId}`;
    });

    const photos = await listPhotos(albumId);
    let index = photos.findIndex((p) => p.id === photoId);
    if (index === -1) index = 0;

    const bodyEl = document.getElementById("viewer-body");
    const nameEl = document.getElementById("viewer-name");
    const metaEl = document.getElementById("viewer-meta");
    const avatarEl = document.getElementById("viewer-avatar");
    const counterEl = document.getElementById("viewer-counter");
    const prevBtn = document.getElementById("nav-prev");
    const nextBtn = document.getElementById("nav-next");

    const LOCALES = { en: "en-US", ca: "ca-ES", es: "es-ES", ru: "ru-RU" };
    function formatDate(ts) {
      if (!ts?.toDate) return "";
      return ts.toDate().toLocaleDateString(LOCALES[getLang()], { month: "short", day: "numeric" });
    }

    function render() {
      const photo = photos[index];
      photoId = photo.id;
      const newUrl = `photo-viewer.html?albumId=${albumId}&photoId=${photoId}`;
      history.replaceState(null, "", newUrl);

      bodyEl.innerHTML =
        photo.type === "video"
          ? `<video src="${photo.url}" controls playsinline></video>`
          : `<img src="${photo.url}" alt="">`;

      const name = photo.uploadedByName || "Guest";
      nameEl.textContent = name;
      avatarEl.textContent = name.charAt(0).toUpperCase();
      metaEl.textContent = formatDate(photo.createdAt);
      counterEl.textContent = `${index + 1} / ${photos.length}`;

      prevBtn.hidden = index === 0;
      nextBtn.hidden = index === photos.length - 1;

      if (isAdmin()) {
        document.getElementById("action-cover").style.visibility = photo.type === "video" ? "hidden" : "visible";
      }
    }

    render();

    prevBtn.addEventListener("click", () => {
      if (index > 0) { index--; render(); }
    });
    nextBtn.addEventListener("click", () => {
      if (index < photos.length - 1) { index++; render(); }
    });

    document.getElementById("action-save").addEventListener("click", () => {
      const photo = photos[index];
      const a = document.createElement("a");
      a.href = photo.url;
      a.download = "";
      a.target = "_blank";
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    document.getElementById("action-share").addEventListener("click", async () => {
      const photo = photos[index];
      if (navigator.share) {
        try {
          await navigator.share({ url: photo.url, title: "Mallorca Wedding" });
        } catch {
          /* user cancelled */
        }
      } else {
        await navigator.clipboard.writeText(photo.url);
        alert(t("viewer.linkCopied"));
      }
    });

    document.getElementById("action-cover").addEventListener("click", async () => {
      const photo = photos[index];
      if (photo.type === "video") return;
      await setAlbumCover(albumId, photo.url);
      alert(t("album.coverSet"));
    });

    document.getElementById("action-delete").addEventListener("click", async () => {
      const photo = photos[index];
      if (!confirm(t("viewer.confirmDelete"))) return;
      await deletePhoto(albumId, photo);
      photos.splice(index, 1);
      if (!photos.length) {
        window.location.href = `album.html?id=${albumId}`;
        return;
      }
      index = Math.min(index, photos.length - 1);
      render();
    });

    // ---- Move ----
    const moveOverlay = document.getElementById("move-overlay");
    const moveSelect = document.getElementById("move-select");

    document.getElementById("action-move").addEventListener("click", async () => {
      const albums = (await listAlbums()).filter((a) => a.id !== albumId);
      if (!albums.length) {
        alert(t("viewer.noOtherAlbums"));
        return;
      }
      moveSelect.innerHTML = albums.map((a) => `<option value="${a.id}">${a.name}</option>`).join("");
      moveOverlay.classList.add("is-open");
    });
    document.getElementById("move-cancel").addEventListener("click", () => {
      moveOverlay.classList.remove("is-open");
    });
    document.getElementById("move-confirm").addEventListener("click", async () => {
      const targetAlbumId = moveSelect.value;
      const photo = photos[index];
      await movePhoto(albumId, targetAlbumId, photo);
      moveOverlay.classList.remove("is-open");
      photos.splice(index, 1);
      if (!photos.length) {
        window.location.href = `album.html?id=${albumId}`;
        return;
      }
      index = Math.min(index, photos.length - 1);
      render();
    });
  </script>
</body>
</html>
