<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo — Mallorca Wedding</title>
<style>
  @font-face {
    font-family: 'Marcellus';
    src: url(assets/fonts/marcellus.ttf) format('truetype');
    font-display: swap;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#0d1418; }
  body {
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:#1C1C1A;
    display:flex; justify-content:center; align-items:center;
  }

  .app {
    position:relative;
    height:100dvh; max-height:100dvh;
    width:auto; max-width:430px;
    aspect-ratio: 390 / 844;
    margin:auto;
    background:#0d1418;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .viewer {
    position:relative;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
    background:linear-gradient(180deg,#C9B68C 0%,#6E8C95 45%,#16323F 100%);
    overflow:hidden;
  }

  .viewer__scrim-top {
    position:absolute; top:0; left:0; right:0; height:170px;
    background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.28) 55%, rgba(0,0,0,0) 100%);
    pointer-events:none;
  }

  .viewer__top {
    position:relative; z-index:2;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .viewer__back {
    background:none; border:none; color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; padding:4px; line-height:0;
  }
  .viewer__user { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .viewer__avatar {
    width:34px; height:34px; border-radius:50%;
    background:#8FAEB8; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600;
    flex:0 0 auto;
  }
  .viewer__user-text { min-width:0; }
  .viewer__name {
    font-family:'Marcellus', Georgia, serif;
    font-weight:400; font-size:17px;
    color:#fff; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .viewer__meta {
    font-size:12.5px; color:rgba(255,255,255,0.75); line-height:1.3; margin-top:1px;
  }
  .viewer__more {
    background:none; border:none; color:#fff; cursor:pointer;
    flex:0 0 auto; padding:4px; line-height:0;
  }

  .viewer__counter {
    position:relative; z-index:2; text-align:center;
    font-size:13px; font-weight:600;
    color:rgba(255,255,255,0.85);
    letter-spacing:0.02em;
    margin-top:2px;
  }

  .viewer__nav {
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.65);
    background:none; border:none; cursor:pointer;
  }
  .viewer__nav--prev { left:6px; }
  .viewer__nav--next { right:6px; }

  .viewer__body { flex:1; }

  .viewer-actionbar {
    flex:0 0 auto;
    display:flex;
    background:#FEFEFD;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid #ECE8E0;
  }
  .viewer-action {
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    font-size:12px; font-weight:400;
    color:#A6A29A;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  .viewer-action--delete { color:#C24B3F; }
  .viewer-action svg { display:block; }
</style>
</head>
<body>
  <main class="app">

    <div class="viewer">
      <div class="viewer__scrim-top"></div>

      <div class="viewer__top">
        <button class="viewer__back" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="viewer__user">
          <span class="viewer__avatar">M</span>
          <div class="viewer__user-text">
            <div class="viewer__name">Maria</div>
            <div class="viewer__meta">Ceremony &middot; Jul 10</div>
          </div>
        </div>
        <button class="viewer__more" aria-label="More">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
        </button>
      </div>

      <div class="viewer__counter">12 / 48</div>

      <button class="viewer__nav viewer__nav--prev" aria-label="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="viewer__nav viewer__nav--next" aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>

      <div class="viewer__body"></div>
    </div>

    <footer class="viewer-actionbar">
      <button class="viewer-action">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0l-4-4m4 4l4-4"/><path d="M5 18h14"/></svg>
        Save
      </button>
      <button class="viewer-action">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0l-3.5 3.5M12 4l3.5 3.5"/><path d="M5 12v6.5a1.5 1.5 0 001.5 1.5h11a1.5 1.5 0 001.5-1.5V12"/></svg>
        Share
      </button>
      <button class="viewer-action">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11m0 0l-3-3m3 3l-3 3"/><path d="M20 17H9m0 0l3-3m-3 3l3 3"/></svg>
        Move
      </button>
      <button class="viewer-action viewer-action--delete">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5A1.5 1.5 0 0110.5 3h3A1.5 1.5 0 0115 4.5V7"/><path d="M18.5 7l-.8 12.1a2 2 0 01-2 1.9H8.3a2 2 0 01-2-1.9L5.5 7"/><path d="M10 11v6M14 11v6"/></svg>
        Delete
      </button>
    </footer>

  </main>
</body>
</html>
