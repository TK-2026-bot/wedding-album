<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile — Mallorca Wedding</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; }
  body {
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:#FEFEFD;
  }

  /* Обёртка держит ширину (капается на 430px), высота НЕ трогается вообще —
     это ключ: никакой dvh/vh/JS, только классический CSS padding-trick,
     где padding-top в процентах всегда считается от ШИРИНЫ родителя. */
  .phone-frame {
    width:100%;
    max-width:430px;
    margin:0 auto;
  }
  .phone-ratio-box {
    position:relative;
    width:100%;
    padding-top: 216.410%; /* 844/390*100 — жёстко фиксирует пропорцию 390:844 */
  }

  .app {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#FEFEFD;
    overflow:hidden;
  }

  .app__bg {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  /* прозрачные кликабельные зоны поверх картинки */
  .hit {
    position:absolute;
    background:transparent;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.05);
  }
  .hit:active { background: rgba(0,0,0,0.04); }

  .hit--row  { border-radius:14px; }
  .hit--tab  { border-radius:0; }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-ratio-box">
      <main class="app">
    <img class="app__bg" src="assets/img/profile.png" alt="Profile — Sofia">

    <!-- Settings rows -->
    <button class="hit hit--row" style="top:428px;left:28px;width:334px;height:52px;" aria-label="Language" onclick="sendPrompt('Open language selector')"></button>
    <button class="hit hit--row" style="top:522px;left:28px;width:334px;height:52px;" aria-label="Invite links" onclick="sendPrompt('Open invite links')"></button>
    <button class="hit hit--row" style="top:586px;left:28px;width:334px;height:52px;" aria-label="Manage members" onclick="sendPrompt('Open manage members')"></button>
    <button class="hit hit--row" style="top:678px;left:28px;width:334px;height:52px;" aria-label="Log out" onclick="window.location.href='login.html'"></button>

    <!-- Tabbar -->
    <button class="hit hit--tab" style="top:745px;left:0;width:97.5px;height:99px;" aria-label="Home" onclick="window.location.href='index.html'"></button>
    <button class="hit hit--tab" style="top:745px;left:97.5px;width:97.5px;height:99px;" aria-label="Albums" onclick="window.location.href='albums.html'"></button>
    <button class="hit hit--tab" style="top:745px;left:195px;width:97.5px;height:99px;" aria-label="Search" onclick="window.location.href='#'"></button>
    <button class="hit hit--tab" style="top:745px;left:292.5px;width:97.5px;height:99px;" aria-label="Profile" ></button>
  </main>
  <script>
    // JS-подстраховка на случай, если браузер не поддерживает CSS aspect-ratio:
    // принудительно выставляет размер .app по пропорции 390:844.
    (function () {
      var RATIO = 390 / 844;
      var app = document.querySelector('.app');
      function resize() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var maxW = Math.min(vw, 430);
        var h = Math.min(vh, maxW / RATIO);
        var w = h * RATIO;
        app.style.width = w + 'px';
        app.style.height = h + 'px';
      }
      resize();
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>
