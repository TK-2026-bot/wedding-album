<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile — Mallorca Wedding</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  .profile-hero {
    position: relative;
    flex: 0 0 auto;
    height: 260px;
    overflow: hidden;
  }
  .profile-hero img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .profile-hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, var(--bg) 96%);
  }
  .profile-hero .topbar,
  .profile-hero .topbar__title {
    position: relative;
    z-index: 2;
    color: #fff;
  }
  .profile-header {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6px;
  }
  .profile-avatar {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-title);
    font-size: 30px;
    margin-bottom: 12px;
    border: 3px solid rgba(255,255,255,0.85);
  }
  .profile-name { font-family: var(--font-title); font-size: 22px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.35); }
  .role-badge {
    display: none;
    margin-top: 10px;
    padding: 5px 14px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .role-badge.is-visible { display: inline-block; }
  .role-badge--admin { background: var(--gold); color: var(--ink); }
  .role-badge--guest { background: rgba(255,255,255,0.85); color: var(--muted-2); }

  .settings-section + .settings-section { margin-top: 4px; }
  .settings-section__label {
    padding: 14px 28px 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .settings-list { padding: 0 28px 8px; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    background: none; border: none;
    border-radius: 14px;
    padding: 16px 8px;
    font-size: 16px;
    font-family: var(--font-ui);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .settings-row:hover { background: var(--bg-alt); }
  .settings-row + .settings-row { border-top: 1px solid var(--divider-2); }
  .settings-row__value { color: var(--muted); font-size: 14px; }
  .settings-row--danger { color: var(--danger); }

  .members-list {
    margin: 0 28px 20px;
    padding: 8px 12px;
    background: var(--bg-alt);
    border-radius: 14px;
    display: none;
  }
  .members-list.is-open { display: block; }
  .members-list__row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px;
    font-size: 15px;
  }
  .members-list__row + .members-list__row { border-top: 1px solid var(--divider-2); }
  .members-list__role { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  .toast {
    position: absolute;
    bottom: calc(90px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 20px;
    font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
    z-index: 30;
    white-space: nowrap;
  }
  .toast.is-visible { opacity: 1; }

  .lang-overlay {
    position: absolute; inset: 0; z-index: 25;
    background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end;
  }
  .lang-overlay.is-open { display: flex; }
  .lang-sheet {
    width: 100%; background: var(--bg);
    border-radius: 20px 20px 0 0;
    padding: 12px 24px calc(24px + env(safe-area-inset-bottom));
  }
  .lang-sheet__handle { width: 40px; height: 4px; background: #DEDAD2; border-radius: 3px; margin: 0 auto 18px; }
  .lang-sheet h2 { font-family: var(--font-title); font-size: 22px; text-align: center; margin-bottom: 16px; }
  .lang-option {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; background: none; border: none;
    padding: 15px 6px; font-size: 17px; color: var(--ink);
    font-family: var(--font-ui); cursor: pointer; text-align: left;
  }
  .lang-option + .lang-option { border-top: 1px solid var(--divider-2); }
  .lang-option__check { color: var(--gold-text); font-weight: 700; visibility: hidden; }
  .lang-option.is-selected .lang-option__check { visibility: visible; }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <div class="notch"></div>
    <div class="screen">
      <div class="profile-hero">
        <img src="assets/img/profile-hero.png" alt="">
        <div class="topbar">
          <div class="topbar__side"></div>
          <div class="topbar__title" data-i18n="profile.title">Profile</div>
          <div class="topbar__side topbar__side--right"></div>
        </div>
        <div class="profile-header">
          <div class="profile-avatar" id="profile-avatar">?</div>
          <div class="profile-name" id="profile-name">…</div>
          <span class="role-badge" id="role-badge"></span>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section__label" data-i18n="profile.sectionPreferences">PREFERENCES</div>
        <div class="settings-list">
          <button class="settings-row" type="button" id="row-language">
            <span data-i18n="profile.language">Language</span>
            <span class="settings-row__value" id="language-value">English</span>
          </button>
        </div>
      </div>

      <div class="settings-section" id="admin-tools-section" style="display:none;">
        <div class="settings-section__label" data-i18n="profile.sectionAdminTools">ADMIN TOOLS</div>
        <div class="settings-list">
          <button class="settings-row" type="button" id="row-invite">
            <span data-i18n="profile.invite">Invite links</span>
            <span class="settings-row__value" data-i18n="profile.copy">Copy</span>
          </button>
          <button class="settings-row" type="button" id="row-members">
            <span data-i18n="profile.members">Manage members</span>
            <span class="settings-row__value" id="members-count">…</span>
          </button>
        </div>
        <div class="members-list" id="members-list"></div>
      </div>

      <div class="settings-section">
        <div class="settings-section__label" data-i18n="profile.sectionAccount">ACCOUNT</div>
        <div class="settings-list">
          <button class="settings-row settings-row--danger" type="button" id="row-logout" data-i18n="profile.logout">
            Log out
          </button>
        </div>
      </div>
    </div>

    <nav class="tabbar">
      <a class="tab" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a class="tab" href="albums.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg>
        <span data-i18n="nav.albums">Albums</span>
      </a>
      <a class="tab" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <span data-i18n="nav.search">Search</span>
      </a>
      <a class="tab is-active" href="profile.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>

    <div class="toast" id="toast"></div>

    <div class="lang-overlay" id="lang-overlay">
      <div class="lang-sheet">
        <div class="lang-sheet__handle"></div>
        <h2 data-i18n="profile.chooseLanguage">Choose language</h2>
        <div id="lang-options"></div>
      </div>
    </div>
  </main>
  </div>
  </div>

  <script type="module">
    import { requireAuth, getGuestName, signOutGuest } from "./js/auth.js";
    import { listGuests, getGuest } from "./js/data.js";
    import { applyTranslations, t, getLang, setLang, LANGUAGES } from "./js/i18n.js";

    applyTranslations();
    const user = await requireAuth();

    const name = getGuestName();
    document.getElementById("profile-name").textContent = name;
    document.getElementById("profile-avatar").textContent = name.charAt(0).toUpperCase();

    const roleBadge = document.getElementById("role-badge");
    const adminToolsSection = document.getElementById("admin-tools-section");
    getGuest(user.uid).then((me) => {
      const isAdmin = me?.role === "admin";
      roleBadge.textContent = t(isAdmin ? "profile.roleAdmin" : "profile.roleGuest");
      roleBadge.className = `role-badge is-visible role-badge--${isAdmin ? "admin" : "guest"}`;
      adminToolsSection.style.display = isAdmin ? "" : "none";
      if (isAdmin) loadGuests().catch(() => { membersCount.textContent = "—"; });
    });

    const toast = document.getElementById("toast");
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("is-visible");
      setTimeout(() => toast.classList.remove("is-visible"), 2200);
    }

    document.getElementById("row-invite").addEventListener("click", async () => {
      const link = `${window.location.origin}${window.location.pathname.replace(/profile\.html$/, "login.html")}`;
      try {
        await navigator.clipboard.writeText(link);
        showToast(t("profile.linkCopied"));
      } catch {
        showToast(link);
      }
    });

    document.getElementById("row-logout").addEventListener("click", () => {
      signOutGuest();
    });

    const membersList = document.getElementById("members-list");
    const membersCount = document.getElementById("members-count");

    async function loadGuests() {
      const guests = await listGuests();
      membersCount.textContent = String(guests.length);
      membersList.innerHTML = guests
        .map(
          (g) => `<div class="members-list__row">
            <span>${escapeHtml(g.name || "Guest")}</span>
            <span class="members-list__role">${t(g.role === "admin" ? "profile.roleAdmin" : "profile.roleGuest")}</span>
          </div>`
        )
        .join("");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById("row-members").addEventListener("click", () => {
      membersList.classList.toggle("is-open");
    });

    // ---- Language picker ----
    const languageValue = document.getElementById("language-value");
    const langOverlay = document.getElementById("lang-overlay");
    const langOptions = document.getElementById("lang-options");

    function renderLanguageValue() {
      languageValue.textContent = LANGUAGES.find((l) => l.code === getLang())?.label || "English";
    }
    renderLanguageValue();

    function renderLangOptions() {
      const current = getLang();
      langOptions.innerHTML = LANGUAGES.map(
        (l) => `<button type="button" class="lang-option ${l.code === current ? "is-selected" : ""}" data-code="${l.code}">
          <span>${l.label}</span>
          <span class="lang-option__check">✓</span>
        </button>`
      ).join("");
      langOptions.querySelectorAll(".lang-option").forEach((btn) => {
        btn.addEventListener("click", () => {
          setLang(btn.dataset.code);
          renderLanguageValue();
          renderLangOptions();
          langOverlay.classList.remove("is-open");
        });
      });
    }

    document.getElementById("row-language").addEventListener("click", () => {
      renderLangOptions();
      langOverlay.classList.add("is-open");
    });
    langOverlay.addEventListener("click", (e) => {
      if (e.target === langOverlay) langOverlay.classList.remove("is-open");
    });
  </script>
</body>
</html>
