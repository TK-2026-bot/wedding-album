<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; }
  body {
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:#FEFEFD;
  }

  /* Обёртка держит ширину (капается на 430px), высота НЕ трогается вообще —
     это ключ: никакой dvh/vh/JS, только классический CSS padding-trick,
     где padding-top в процентах всегда считается от ШИРИНЫ родителя. */
  .phone-frame {
    width:100%;
    max-width:430px;
    margin:0 auto;
  }
  .phone-ratio-box {
    position:relative;
    width:100%;
    padding-top: 216.410%; /* 844/390*100 — жёстко фиксирует пропорцию 390:844 */
  }

  .app {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#FEFEFD;
    overflow:hidden;
  }

  .app__bg {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  /* прозрачные кликабельные зоны поверх картинки */
  .hit {
    position:absolute;
    background:transparent;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.05);
  }
  .hit:active { background: rgba(0,0,0,0.04); }

  .hit--row  { border-radius:14px; }
  .hit--tab  { border-radius:0; }
</style>

    (function () {
      var RATIO = 390 / 844;
      var app = document.querySelector('.app');
      function resize() {
        var vw = window.innerWidth;

      resize();
      window.addEventListener('resize', resize);
