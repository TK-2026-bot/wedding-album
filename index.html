<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mallorca Wedding</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  /* --- Home-специфичное --- */
  .hero { position: relative; }
  .hero__img { display: block; width: 100%; height: auto; }

  .home-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 20px;
  }
  .home-card {
    flex: 1 1 calc(50% - 8px);
    min-width: calc(50% - 8px);
    height: 240px;
    border-radius: 14px;
    position: relative;
    display: flex;
    align-items: center;
    padding: 20px;
    text-decoration: none;
    overflow: hidden;
  }
  .home-card__title {
    font-family: var(--font-title);
    font-size: 24px;
    color: #fff;
    line-height: 1.15;
    text-shadow: 0 1px 6px rgba(0,0,0,0.25);
  }
  .empty-state { text-align: center; color: var(--muted); font-size: 15px; padding: 20px 12px; width: 100%; }
</style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-ratio-box">
  <main class="app">
    <div class="screen">

      <!-- Герой: фото моря + логотип (шрифт-росчерк как ассет) -->
      <header class="hero">
        <img class="hero__img" src="assets/img/index.png"
             alt="Mallorca Wedding — Pau & Sofia">
      </header>

      <!-- Закреплённые карточки-альбома -->
      <section class="home-cards" id="home-cards">
        <p class="empty-state" data-i18n="common.loading">Loading…</p>
      </section>

    </div>

    <!-- Нижняя навигация -->
    <nav class="tabbar">
      <a class="tab is-active" href="index.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a class="tab" href="albums.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg>
        <span data-i18n="nav.albums">Albums</span>
      </a>
      <a class="tab" href="search.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <span data-i18n="nav.search">Search</span>
      </a>
      <a class="tab" href="profile.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>
  </main>
  </div>
</div>

  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { listAlbums } from "./js/data.js";
    import { applyTranslations, t } from "./js/i18n.js";

    applyTranslations();
    await requireAuth();

    const PLACEHOLDER_CLASSES = ["ph", "ph--blue", "ph--teal", "ph--mauve"];
    const grid = document.getElementById("home-cards");
    const allAlbums = await listAlbums();
    const albums = allAlbums.filter((a) => a.pinned).slice(0, 4);

    if (!albums.length) {
      grid.innerHTML = `<p class="empty-state">${t(allAlbums.length ? "index.emptyPinned" : "index.empty")}</p>`;
    } else {
      grid.innerHTML = albums
        .map((a, i) => {
          const cls = PLACEHOLDER_CLASSES[i % PLACEHOLDER_CLASSES.length];
          const cover = a.coverUrl ? `<img src="${a.coverUrl}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">` : "";
          return `<a class="home-card ${a.coverUrl ? "" : cls}" href="album.html?id=${a.id}">
            ${cover}
            <span class="home-card__title" style="position:relative;">${a.name}</span>
          </a>`;
        })
        .join("");
    }
  </script>
</body>
</html>
