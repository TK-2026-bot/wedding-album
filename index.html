body {
  font-family: var(--font-ui);
  color: var(--ink);
  background: #d8d5ce;               /* фон вокруг «телефона» на десктопе */
}

/* Обёртка держит ширину (капается на 430px), высота считается ТОЛЬКО от
   ширины через классический padding-trick — без dvh/vh/JS, поэтому
   пропорция 390:844 не может "уехать" ни при каком окне/превью. */
.phone-frame {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
}
.phone-ratio-box {
  position: relative;
  width: 100%;
  padding-top: 216.410%; /* 844/390*100 */
}
.app {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Notch — присутствует на КАЖДОМ полноэкранном мокапе (spec §5) */
.notch {
  position: absolute;
  top: 9px; left: 50%;
  transform: translateX(-50%);
  width: 94.5px; height: 24px;
  background: #0A0A0A;
  border-radius: 12px;
  z-index: 20;
  pointer-events: none;
}

/* Прокручиваемая область контента (между верхом и нижней навигацией) */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ---------- ВЕРХНЯЯ СТРОКА (topbar) — spec §2 ---------- */
.topbar {
  display: flex;
  align-items: center;              /* все элементы на одной горизонтали */
  justify-content: space-between;
  gap: 8px;
  padding: 14px 20px;
  padding-top: max(44px, calc(14px + env(safe-area-inset-top)));
  min-height: var(--topbar-h);
}
.topbar__side {
  flex: 0 0 auto;
  width: 40px;
  display: flex;
  align-items: center;
}
.topbar__side--right { justify-content: flex-end; }
.topbar__title {
  flex: 1;
  text-align: center;
  font-family: var(--font-title);
  font-size: 26px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1;
}
.iconbtn {
  background: none;
  border: none;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
}
.iconbtn svg { display: block; }

.divider {
  height: 1px;
  background: var(--divider);
  border: none;
}

.meta-row {
  text-align: center;
  color: var(--muted);
  font-size: 15px;
  padding: 14px 0;
}

/* ---------- НИЖНЯЯ НАВИГАЦИЯ (spec §5) ---------- */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  border-top: 1px solid var(--divider-2);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg);
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0 12px;      /* иконки заметно ниже линии-разделителя */
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted-3);
  font-size: 12px;
  font-family: var(--font-ui);
  text-decoration: none;
}
.tab svg { display: block; }
.tab.is-active { color: var(--gold-text); }

/* ---------- КАРТОЧКИ-ПЛЕЙСХОЛДЕРЫ (spec §4, §5) ---------- */
/* Градиенты имитируют будущие фото. border-radius 10px. */
.ph {
  border-radius: 10px;
  position: relative;
  background: linear-gradient(180deg, #C9B68C 0%, #6E8C95 55%, #16323F 100%);
}
.ph--blue  { background: linear-gradient(180deg, #BFE0EE 0%, #5B879B 55%, #16323F 100%); }
.ph--teal  { background: linear-gradient(180deg, #9BC4D2 0%, #3E6B7C 60%, #16323F 100%); }

/* ---------- FAB (spec §5): 56×56, золотая, с тенью ---------- */
.fab {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gold);
  border: none;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(224,189,110,0.45);
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  border: 2px solid var(--bg);
}

/* доступность */
:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
